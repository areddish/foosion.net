<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Foosion Software</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: "#0a0e1a",
          },
          fontFamily: {
            sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
          },
          animation: {
            "float-slow": "float 9s ease-in-out infinite",
            "float-slower": "float 13s ease-in-out infinite",
            "gradient-x": "gradient-x 6s ease infinite",
          },
          keyframes: {
            float: {
              "0%, 100%": { transform: "translateY(0) scale(1)" },
              "50%": { transform: "translateY(-24px) scale(1.05)" },
            },
            "gradient-x": {
              "0%, 100%": { "background-position": "0% center" },
              "50%": { "background-position": "100% center" },
            },
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body class="bg-ink font-sans antialiased selection:bg-indigo-500/40 selection:text-white">

  <!-- Ambient background -->
  <div class="pointer-events-none fixed inset-0 overflow-hidden" aria-hidden="true">
    <div class="absolute -top-40 left-1/2 -translate-x-1/2 h-[34rem] w-[34rem] rounded-full bg-indigo-600/25 blur-[140px] animate-float-slow"></div>
    <div class="absolute bottom-[-12rem] left-[-8rem] h-[28rem] w-[28rem] rounded-full bg-indigo-500/15 blur-[120px] animate-float-slower"></div>
    <div class="absolute top-1/3 right-[-10rem] h-[24rem] w-[24rem] rounded-full bg-fuchsia-500/10 blur-[120px] animate-float-slower"></div>
    <div class="absolute inset-0 bg-[linear-gradient(to_right,rgba(255,255,255,0.03)_1px,transparent_1px),linear-gradient(to_bottom,rgba(255,255,255,0.03)_1px,transparent_1px)] bg-[size:56px_56px] [mask-image:radial-gradient(ellipse_70%_60%_at_50%_50%,black,transparent)]"></div>
  </div>

  <div class="relative grid min-h-screen place-items-center px-6">
    <div class="text-center">
      <p class="animate-gradient-x bg-gradient-to-r from-indigo-300 via-white to-fuchsia-300 bg-[length:200%_auto] bg-clip-text text-6xl font-extrabold tracking-tight text-transparent sm:text-8xl">
        Foosion
      </p>
      <p class="mt-4 text-sm font-medium uppercase tracking-[0.5em] text-slate-400 sm:text-base">
        Software
      </p>
    </div>
  </div>

</body>
</html>
